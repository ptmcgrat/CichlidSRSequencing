# gsdf copy-number genotyping (Mzebra_GT3_NCBI = GT3a). python -m yhsd.cli gsdf depth | call | validate | all
#
# The reference carries two tandem copies of a 21.7 kb unit containing gsdf (NC_135173.1:50,751,322-50,794,777; period 21,728 bp, ~99.4 % identity). Reads from every genomic copy map to both
# reference copies, so a sample's depth over the unit, relative to its own flanks, is proportional to its TOTAL copy number: ratio = copies / 4 (0.50 for two copies, 0.75 for three, 1.00 for four =
# the reference state). Depth gives total copy number, not which chromosome carries the extra copy: assigning it to the Y needs sex or pedigree.
# Coordinates are 0-based, half-open (BED style). Everything below is from the Methods summary of the previous analysis and, where it was ambiguous, from sexloci 0.1.26 (`gsdf.py`), the code the
# calibration and the existing `gsdf number` column were made with (alignments: minimap2 -x sr, the lab recipe; confirmed by the lab). Where this file and sexloci differ, sexloci's rule is used so that the
# constants below stay valid: window_rule, junction_flank_window, estimate_range, clip_copies.
# Measurement (`python -m yhsd.cli panel measure`) and calling (`gsdf call`) are separate: the raw bin depths are stored per sample, so the calibration and the thresholds can change without touching a BAM.

region: {chrom: NC_135173.1, start: 50700000, end: 50830000}     # the only part of the BAM that is read (indexed access to a LOCAL BAM; the panel measures every sample while its BAM is on disk)
bin_bp: 5000
window_rule: start_in_window                                     # a 5 kb bin belongs to a window when its START lies in [window start, window end] (inclusive), as in sexloci: unit = 7 bins (starts 50,755,000-50,785,000), flank = 8 + 4 bins
unit_window: [50755000, 50785000]                                # unit depth = mean of the bins that start inside
flank_windows: [[50700000, 50735000], [50800000, 50815000]]      # flank depth = mean of the bins that start inside
junction_flank_window: [50700000, 50735000]                      # the unique-read (MAPQ >= mapq_unique) flank depth the junction ratio is divided by: the bins ENTIRELY inside this window (sexloci: the first flank only)
junction_window: [50772650, 50773150]                            # junction between the two reference copies: unique reads (MAPQ >= mapq_unique) exist only on chromosomes carrying the tandem duplication
mapq_unique: 30                                                  # depth excludes duplicate-marked reads in both measurements (samtools depth default)

calibration:                                                     # copies = 2 + (ratio - ratio_at_two_copies) / ratio_per_copy ; calibrated on the MC pedigree (daughters 0.530, sons 0.799; expected step 0.25)
  ratio_at_two_copies: 0.530
  ratio_per_copy: 0.268

thresholds:                                                      # a call is FLAGGED (still reported) when
  min_flank_depth: 3.0                                           #   the flank depth is below this (x)
  max_distance_from_integer: 0.35                                #   the estimate is farther than this from an integer
  estimate_range: [0.6, 5.4]                                     #   the UNROUNDED copy-number estimate is outside this range (sexloci's 'outside calibrated range'; five copies exist in the sheet and are not flagged)
  clip_copies: [1, 6]                                            #   the reported number is the rounded estimate clipped to this range
  junction_max_two_copy: 0.15                                    #   CHECK (check_flags, never the call): a sample called with two copies has a unique-read junction ratio above this (all 25 two-copy MC samples were at 0.054 or below; true three-copy samples are often at 0 at 5-6x depth, so a LOW ratio is not checked)
labels: {2: "-/-", 3: "dup/-", 4: "dup/dup"}                     # genotype names (any other number n is named CNn); ONLY valid where the extra copies are on different chromosomes: a male with 4 copies may carry a 3-unit Y. `gsdf number` is the plain total.

select:
  default: missing                                               # samples whose `gsdf number` is empty
  skip_ecogroups: [Error, Exclude]

validate:
  min_per_sex: 3                                                 # species with at least this many males and females get a sex x copy-number table
  male_min_copies: 3                                             # XY-like: females 2, males >= 3
