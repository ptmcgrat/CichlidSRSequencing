# `python -m variant_calling panel ...`: module 04's panel over EXISTING BAMs (download, measure, keep the JSON, delete the BAM), and its calls into the SampleDatabase.
jobs: 2                          # BAMs on disk at a time. Parallel downloads are untested: the first batch prints the throughput of each BAM and of the whole run
min_free_factor: 1.15            # the disk must hold the largest `jobs` BAMs times this; each BAM is deleted as soon as it is measured
default_bam_bytes: 12.0e9        # the size assumed for a sample that is not in the AlignmentDatabase
work_subdir: PanelPass/staged/   # under the local master directory (on utaka /Data/..., never /home): the BAMs being measured
json_subdir: Outputs/PanelJSON/  # <genome>/<sample>.panel.json: the local copy of every measurement, and the log of the pass. The durable copy is on Dropbox next to the BAM
log_name: panel_pass.{genome}.tsv
modules: all                     # what `sd_genotypes panel measure --modules` gets
timeout_s: 1800                  # a measurement that takes longer is killed (it normally takes seconds)
expect_keys: ['5d71ee8d6c2b', '2af781e90119', '80bbea57e10b', '75367d0dfba8']   # the pilot's frozen definition keys (gsdf, te, lg5inv, bchrom): `panel check` must print them or nothing is measured
sheet:
  tab: SampleDatabase            # --tab names a COPY of it for trials
  key: SampleID
  write_columns: [gsdf number, chr7ins, TE1, TE2, Inversion5, B score]     # module 04 lifted the hold on Inversion5 and B score on 2026-11-17 (decision 78); their flags columns follow their value column
  flags_in_sheet: true           # false: write only the values, no `<column> flags` cells. The flags and the numbers behind every call stay in the JSONs and in `panel table`; the call tag (pilot-v1) is in the
                                 # name of each journal under <json dir>/sheet_writes/. Columns already in the sheet are not removed (delete them by hand once you are sure)
  nocall:                        # a genotype cell whose call could not be made gets this instead of staying empty (remove the block to go back to empty cells)
    value: './.'
    columns: [chr7ins, TE1, TE2, Inversion5]   # genotype columns only: the numbers (gsdf number, B score) stay empty when there is no confident call
    flags: [no_call, low_gq, low_depth, few_markers]   # too little data to call, or a call below the GQ cut
    exclude_flags: [site_error, unvalidated_value]     # an error of the site is not a lack of data; an Inversion5 of 2 is held back on purpose (decision 79): both stay empty and `panel table` shows the flag
  scope: {}                      # empty: every column is written for every ecogroup. The mbuna-only scope of decision 78 was lifted on 2026-11-21; to limit a column again use {column: [Ecogroup, ...]}
