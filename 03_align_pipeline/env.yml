# Module 03 (the alignment pipeline): the alignment tools, the lab's file manager (Google Sheets) and the panel's dependencies (numpy, pandas, pyyaml), so one environment can align AND measure.
# Python 3.8 or newer (the old Python 3.7 environment of utaka cannot run the panel of module 04; make this one there).
# rclone is the machine's own (decision 23: a conda rclone would not see the machine's remote configuration).
# sd_genotypes is not a conda package: it is checked out with this repository (04_genotype_sd_systems). Either `pip install -e 04_genotype_sd_systems` into this environment, or pass
# --panel-pythonpath <repo>/04_genotype_sd_systems to `python -m align_pipeline run`.
name: align
channels: [conda-forge, bioconda]
dependencies:
  - python=3.11
  - pandas
  - numpy
  - pyyaml
  - requests
  - pysam
  - gatk4
  - samtools
  - minimap2
  - pip
  - pip:
      - gspread
      - gspread-dataframe
      - google-auth
# optional, for the panel's transposon module (about 100 times faster than the numpy fallback): - parasail-python
