# Module 03 (the alignment pipeline): the alignment tools, the lab's file manager (Google Sheets) and the panel's dependencies (numpy, pandas, pyyaml), so one environment can align AND measure.
# The three tool versions are pinned to what the yellowhead environment `genomics` had on 2026-11-07 (the 45-sample batch was aligned with them), so the whole pilot cohort is aligned with ONE set of tools.
# samtools is pinned to the version of `genomics` too (1.24), so every machine builds the same toolset; it only counts and indexes, it does not change an alignment.
# Python 3.9 or newer (the old Python 3.7 environment of utaka cannot run the panel of module 04; make this one there).
# rclone is the machine's own (decision 23: a conda rclone would not see the machine's remote configuration).
# sd_genotypes is not a conda package: it comes with this repository (04_genotype_sd_systems); `source tools/env.sh` puts it on PYTHONPATH, and the panel inherits that.
name: align
channels: [conda-forge, bioconda]
dependencies:
  - python>=3.9
  - pandas
  - numpy
  - pyyaml
  - requests
  - pysam=0.24.1
  - gatk4=4.6.2.0
  - minimap2=2.31
  - samtools=1.24
  - pip
  - pip:
      - gspread
      - gspread-dataframe
      - google-auth
# optional, for the panel's transposon module (much faster than the numpy fallback): - parasail-python
