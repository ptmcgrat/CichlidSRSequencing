[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sexloci"
version = "0.1.26"
description = "Map sex-linked loci (XY/ZW, with or without inversions) from variant data plus sex and pedigree metadata"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.22",
    "pandas>=1.5",
    "scipy>=1.9",
    "matplotlib>=3.5",
    "pyyaml>=6",
    "gspread>=5.12",
    "gspread-dataframe>=3.3",
    "google-auth>=2.0",
]

[project.optional-dependencies]
fast = ["scikit-allel>=1.3"]
indel = ["parasail>=1.3"]
test = ["pytest"]

[project.scripts]
sexloci = "sexloci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
