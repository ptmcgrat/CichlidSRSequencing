# cloud_vcf_subdir: "Outputs/PedigreeVCFs/"
# sheets_read_only: true

# genome_overview.png: mark the known sex-determination loci (gsdf on LG7, the two transposon insertions on LG10) -- default true
# show_known_loci: true
